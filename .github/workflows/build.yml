name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - ui-refresh-black-metallic-red

jobs:
  build:
    name: Build Fermata-Yasin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read versions from version catalog
        run: |
          ver_file=fermata_original/Fermata-master/gradle/libs.versions.toml
          version() { grep -Po "(?<=$1).+" $ver_file | sed -e 's/[= "]//g'; }
          app_version="$(version appVersionName)-$(git rev-parse --short HEAD)"
          sed -ri "s/appVersionName.+/appVersionName = \"$app_version\"/" $ver_file
          echo "APP_VERSION=$app_version" >> $GITHUB_ENV
          echo "ANDROID_NDK_VERSION=$(version ndkVersion)" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ${{ runner.os }}-android-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x fermata_original/Fermata-master/gradlew

      # The TV/IPTV, radio, web, etc. modules under modules/ are dynamic features
      # of :fermata, so a plain assembleDebug APK would not contain them. The
      # universal-APK packaging tasks (same as upstream) bundle them in.
      - name: Build Debug APKs (mobile + auto)
        id: build
        working-directory: fermata_original/Fermata-master
        env:
          NO_GS: true
        run: |
          set -o pipefail
          ./gradlew fermata:packageMobileDebugUniversalApk fermata:packageAutoDebugUniversalApk \
            -PABI=arm64-v8a,armeabi-v7a --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # Publish Gradle's real error text as annotations so it is visible on the
      # run summary / check-run API without opening the raw log.
      - name: Annotate Gradle errors
        if: failure() && steps.build.outcome == 'failure'
        run: |
          log="$RUNNER_TEMP/gradle.log"
          [ -f "$log" ] || exit 0
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'; }
          wrong="$(awk '/\* What went wrong:/{f=1;c=0} f{print substr($0,1,300); if(++c>=14) exit}' "$log" | enc)"
          [ -z "$wrong" ] || echo "::error title=Gradle - What went wrong::$wrong"
          errs="$(grep -E '^e: |error:|AAPT: error|Execution failed for task|Could not resolve|Unsupported|SDK location|licen[sc]e' "$log" | head -n 15 | cut -c1-300 | enc)"
          [ -z "$errs" ] || echo "::error title=Gradle - error lines::$errs"

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: fermata-yasin-debug
          path: fermata_original/Fermata-master/fermata/build/outputs/apk_from_bundle/*/*.apk
          retention-days: 30
          if-no-files-found: error