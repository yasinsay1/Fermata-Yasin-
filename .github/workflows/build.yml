name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - ui-refresh-black-metallic-red

jobs:
  build:
    name: Build Fermata-Yasin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read versions from version catalog
        run: |
          ver_file=fermata_original/Fermata-master/gradle/libs.versions.toml
          version() { grep -Po "(?<=$1).+" $ver_file | sed -e 's/[= "]//g'; }
          app_version="$(version appVersionName)-$(git rev-parse --short HEAD)"
          sed -ri "s/appVersionName.+/appVersionName = \"$app_version\"/" $ver_file
          echo "APP_VERSION=$app_version" >> $GITHUB_ENV
          echo "ANDROID_NDK_VERSION=$(version ndkVersion)" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          key: ${{ runner.os }}-android-ndk-${{ env.ANDROID_NDK_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x fermata_original/Fermata-master/gradlew

      - name: Build Debug APK
        working-directory: fermata_original/Fermata-master
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fermata-yasin-debug
          path: fermata_original/Fermata-master/fermata/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error