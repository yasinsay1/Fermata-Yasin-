
name: Build Fermata APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Fermata source
        run: |
          git clone --recurse-submodules https://github.com/AndreyPavlenko/Fermata.git Fermata
          
      - name: Build APK
        working-directory: Fermata
        run: |
          chmod +x gradlew
          ./gradlew assembleAutoRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fermata-APK
          path: Fermata/**/*.apk
          if-no-files-found: error
          
