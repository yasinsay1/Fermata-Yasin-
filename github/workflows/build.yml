
name: Build Fermata APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone original Fermata source
        run: |
          git clone --recurse-submodules https://github.com/AndreyPavlenko/Fermata.git fermata-source

      - name: Build Fermata
        working-directory: fermata-source
        run: |
          chmod +x gradlew
          ./gradlew assembleAutoRelease --no-daemon

      - name: Find APK files
        run: |
          find fermata-source -type f -name "*.apk" -print

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fermata-APK
          path: fermata-source/**/*.apk
          if-no-files-found: error
          
